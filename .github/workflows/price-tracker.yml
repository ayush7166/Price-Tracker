name: Price Tracker

on:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

  # Allows manual execution from GitHub
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Run price tracker worker
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}" \
            https://price-tracker-backend-vz5k.onrender.com/api/run-worker