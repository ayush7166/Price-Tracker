services:

  backend:
    build: ./backend
    container_name: price-tracker-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/price_tracker
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: price-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: